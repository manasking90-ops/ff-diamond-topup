<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="admin wrap"><div class="admin-head"><div><div class="section-kicker">CONTROL CENTER</div><h1>ORDER REVIEW</h1></div><a class="logout" href="/admin/logout">Logout</a></div><div class="table-wrap"><table><thead><tr><th>Order</th><th>UID</th><th>Server</th><th>Package</th><th>Amount</th><th>Status</th><th>Proof</th><th>Action</th></tr></thead><tbody>{% for o in orders %}<tr><td>{{o.order_code}}</td><td>{{o.uid}}</td><td>{{o.server}}</td><td>{{o.diamonds}} 💎</td><td>₹{{o.amount}}</td><td><span class="status {{o.payment_status}}">{{o.payment_status}}</span></td><td>{% if o.screenshot %}<a href="{{ url_for('static', filename='uploads/' + o.screenshot) }}" target="_blank">View</a><br><small>{{o.utr}}</small>{% else %}—{% endif %}</td><td><form class="actions" method="post" action="/admin/order/{{o.id}}/approved"><button>Approve</button></form><form class="actions" method="post" action="/admin/order/{{o.id}}/rejected"><button>Reject</button></form></td></tr>{% else %}<tr><td colspan="8">No orders yet.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
